# Server Configuration
server.port=8080
spring.application.name=dlrs-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/dlrs_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage Configuration
file.upload-dir=./uploads

# JWT Configuration
jwt.secret=dlrs-secret-key-change-in-production-this-should-be-very-long-and-secure
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
logging.level.com.dlrs=DEBUG
logging.level.org.springframework.security=DEBUG

